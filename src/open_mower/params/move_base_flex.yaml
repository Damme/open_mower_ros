planners:
  - name: GlobalPlanner
    type: global_planner/GlobalPlanner

controllers:
  - name: FTCPlanner
    type: ftc_local_planner/FTCPlanner
  - name: DockingFTCPlanner
    type: ftc_local_planner/FTCPlanner


controller_frequency: 1.0
controller_patience: 30.0

# 0 = no periodic replanning. The costmaps are static-map only, so replanning
# gains nothing, and MBF 0.4.0's replanning thread races its own action clients
# (getElem() crash). See src/lib/mbf_abstract_nav/src/move_base_action.cpp.
planner_frequency: 0.0
planner_patience: 5.0

oscillation_timeout: 10.0
oscillation_distance: 0.2
